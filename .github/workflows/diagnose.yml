# Manual: Actions -> diagnose -> Run workflow. Shows what jobwatch finds for companies that never yield jobs.
name: diagnose

on:
  workflow_dispatch:
    inputs:
      companies:
        description: 'Company names, separated by | (leave empty = every company with 0 jobs ever found)'
        required: false
        default: ''

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Diagnose
        env:
          NAMES: ${{ inputs.companies }}
        run: |
          if [ -z "$NAMES" ]; then
            python scripts/diagnose.py --zero
          else
            IFS='|' read -ra ARR <<< "$NAMES"
            python scripts/diagnose.py "${ARR[@]}"
          fi
