# ---------------------------------------------------------- LANGUAGE
# true = drop jobs whose description clearly demands fluent / native Dutch
# ("fluent Dutch", "Dutch is required", "C1", "vloeiend Nederlands",
# "uitstekende beheersing van de Nederlandse taal", "in woord en geschrift").
# Jobs that accept basic or intermediate Dutch (A1-B2), only prefer it
# ("Dutch is a plus", "Nederlands is een pre") or don't mention it are kept;
# those that accept basic Dutch are marked "basic Dutch OK" in the alert.
