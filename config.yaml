# --------------------------------------------------------- 3. EXPERIENCE
# For every new posting that passes the title check, jobwatch opens the job
# description and looks for how many years of experience it asks for
# ("0-2 years", "2-4 years", "at least 3 years", "minimaal 3 jaar ervaring", ...).
# Ranges count by their lower number: "3-5 years" counts as 3.
check_experience: true

# Keep postings that ask for at most this many years.
#   2 -> only 0-2 years      3 -> up to 0-3 years
#   4 -> up to 0-4 years     5 -> up to 0-5 years
max_years_experience: 2

# Many postings don't mention years at all.
# true = still alert (recommended)   false = skip them
keep_if_experience_unknown: true

# ------------------------------------------------------------ 4. LOCATION
# Wanted: the Netherlands and Belgium. Everything else is dropped.
# jobwatch looks for a place in: the location the careers site gives, the job
# title, the job link, and - if still unclear - the job page itself (a posting
# written in Dutch counts as NL/BE).
#   1. a wanted place below is found                -> keep
#   2. a foreign place below is found (and no wanted one) -> drop
#   3. still no idea where the job is:
#        keep_unmatched_locations: false -> drop  (no more US / China jobs)
#        keep_unmatched_locations: true  -> keep  (nothing missed, more noise)
# To add a country: put its name and main cities under location_keywords and
# remove them from foreign_location_keywords.
keep_unmatched_locations: false

