# jobwatch settings. Open with Notepad, edit, save (Ctrl+S). Takes effect on the next run.
# Rules: keep the 2 spaces + dash in front of each word ("  - word"). Never use the Tab key.
# Matching ignores upper/lower case and looks at the job TITLE.

