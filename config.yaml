# ------------------------------------------------------------- 5. OTHER
# Be polite to company websites.
request_delay_seconds: 2
timeout_seconds: 25
respect_robots_txt: true
user_agent: "jobwatch/1.0 (personal job-alert script; checks a few times a day)"

# Max postings to read from each Workday-type feed per run.
max_jobs_per_api: 300
# Skip companies below this priority (Low | Medium | High).
min_priority: Low

# Every alert also lists the jobs already shown to you in the last N hours
# (marked "already shown"), so nothing scrolls out of sight. 0 = only new jobs.
repeat_hours: 24

# Every N runs, add a list of careers pages that have failed 3+ times in a row
# to the email so you can fix their links. 0 = never.
notify_errors_every_runs: 28
